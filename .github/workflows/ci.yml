name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lets verify compare the supplied artifacts with the evaluator's initial commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # Offline by design: no provider secrets are exposed, and verify strips any
      # provider keys from its child processes. Live OCR is recorded as NOT_RUN.
      - run: make verify PYTHON=python
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: docs/reports/

  browser:
    runs-on: ubuntu-latest
    env:
      PLUM_SCREENSHOT_DIR: ${{ runner.temp }}/plum-browser-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise claimant and reviewer screens
        env:
          PLUM_ENV: development
          PLUM_DEMO_CLOCK: '2024-11-05'
          PLUM_REVIEW_TOKEN: ci-browser-review-token
        run: |
          export PLUM_DATA_DIR="$(mktemp -d)"
          python -m tools.generate_samples
          python -m uvicorn claims.web:app > /tmp/plum-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/plum-browser-server.log; exit 1; fi
            sleep 1
          done
          python -m scripts.browser_check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure
          path: |
            /tmp/plum-browser-server.log
            ${{ runner.temp }}/plum-browser-screenshots/
