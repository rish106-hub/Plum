name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lets verify compare the supplied artifacts with the evaluator's initial commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # Offline by design: no provider secrets are exposed, and verify strips any
      # provider keys from its child processes. Live OCR is recorded as NOT_RUN.
      - run: make verify PYTHON=python
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: docs/reports/
